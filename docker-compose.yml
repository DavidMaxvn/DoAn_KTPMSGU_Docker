version: "3.9"

services:
  sqlserver:
    build:
      context: .
      dockerfile: docker/database/Dockerfile
    environment:
      SA_PASSWORD: ${SA_PASSWORD:-YourStrong!Passw0rd}
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  appapi:
    build:
      context: .
      dockerfile: AppAPI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DBContext: Server=sqlserver;Database=AppBanQuanAoThoiTrangNam;User Id=sa;Password=${SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8081:8080"

  appview:
    build:
      context: .
      dockerfile: AppView/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      API_BASE_URL: http://appapi:8080/api/
    depends_on:
      - appapi
    ports:
      - "8080:8080"

volumes:
  mssql-data:
