services:
  sql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=StrongPass@123
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql

  db-init:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: db-init
    depends_on:
      - sql
    environment:
      - SA_PASSWORD=StrongPass@123
      - DB_HOST=sql
      - DB_PORT=1433
      - DB_USER=sa
    volumes:
      - ./scriptquanao_new.sql:/init/scriptquanao_new.sql:ro
      - ./docker/sql/init-db.sh:/init/init-db.sh:ro
    entrypoint: ["/bin/bash", "/init/init-db.sh"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: AppAPI/Dockerfile
    container_name: api
    depends_on:
      sql:
        condition: service_started
      db-init:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:9000
      - ConnectionStrings__DBContext=Data Source=sql,1433;Database=AppBanQuanAoThoiTrangNam;User ID=sa;Password=StrongPass@123;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True
    ports:
      - "9000:9000"

  appview:
    build:
      context: .
      dockerfile: AppView/Dockerfile
    container_name: appview
    depends_on:
      - api
    environment:
      - Api__BaseUrl=http://api:9000
    ports:
      - "7000:8080"

volumes:
  mssqldata:
